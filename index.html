<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKG 전적 대시보드</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <aside class="card side">
    <div class="brand"><span class="dot"></span>MKG</div>
    <div class="sub">티어별 최근 30전 전적표</div>
    <div class="stat">
      <div class="row"><span>전체 인원</span><b id="sMem">-</b></div>
      <div class="row"><span>전체 전적</span><b id="sRec">-</b></div>
      <div class="lbl">최근 수정</div><div id="sUpd" style="font-size:11.5px;margin-top:3px">-</div>
      <div class="lbl">접속 상태</div><div class="pill" id="sConn">연결 중…</div>
    </div>
    <div class="stat" id="spaceBox"></div>
    <button class="btn wide" id="themeBtn">라이트 스타일로 보기</button>
    <div id="tierNav"></div>
  </aside>
  <main>
    <div class="card head">
      <div class="eyebrow">RANK BOARD</div>
      <h1>MKG 전적 대시보드<span id="spaceTitle" class="stitle"></span></h1>
      <p>티어별 유저 전적을 한눈에 확인하고, 관리자 권한으로 전적을 추가 및 관리할 수 있습니다.</p>
    </div>
    <div class="card search">
      <input id="q" placeholder="⌕  두글자 닉네임 또는 풀네임 검색">
      <button class="btn" id="allBtn">전체</button>
    </div>
    <div id="selBar" class="card hide" style="padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <span>삭제할 전적 칸을 클릭해서 선택하세요 · <b id="selCnt" style="color:var(--gold)">0</b>개 선택</span>
      <span><button class="btn" id="selCancel">취소</button> <button class="btn" id="selDo" style="color:#ff7b7f;border-color:#5a2230;background:#221014">선택 삭제</button></span>
    </div>
    <div id="board"><div class="card load">불러오는 중…</div></div>
  </main>
  <aside class="card rank">
    <div class="top"><div><div class="eyebrow">MEMBER RANKING</div><h3>최고승률 TOP10</h3><small>전적이 1게임 이상 있는 등록 멤버 기준</small></div><span class="cnt" style="color:var(--gold);border-color:#4a3f16">10명</span></div>
    <div id="rankList"></div>
  </aside>
  <div class="acol">
    <button class="big b1" id="loginBtn">관리자 로그인</button>
    <button class="big b2" id="addBtn">전적 추가</button>
    <button class="big b3" id="delBtn">전적 선택 삭제</button>
    <a class="big b4" href="draft/">팀뽑기 (드래프트)</a>
    <button class="big b1" id="acctBtn" style="padding:11px 10px;font-size:12px">계정 관리</button>
    <div class="who" id="who"></div>
  </div>
</div>
<div id="modal"></div>
<div class="gate" id="gate"><div class="card gcard">
  <div class="brand"><span class="dot"></span>MKG</div>
  <h2 id="gTitle">관리자 로그인</h2><p id="gDesc">등록된 관리자만 대시보드에 들어갈 수 있습니다</p>
  <label>아이디</label><input id="gId" autocomplete="username">
  <label>비밀번호</label><input id="gPw" type="password" autocomplete="current-password">
  <div id="gPw2Wrap" class="hide"><label>비밀번호 확인</label><input id="gPw2" type="password" autocomplete="new-password"></div>
  <button class="btn go" id="gGo">로그인</button>
  <div class="gerr" id="gErr"></div>
</div></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
